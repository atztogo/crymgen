[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crymgen"
dynamic = ["version"]
readme = {file = "README.md", content-type = "text/markdown"}
description = "This is the crymgen module."
authors = [
    {name = "Atsushi Togo", email = "atztogo@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "spglib >= 2.5",
    "PyYAML>=5.3",
]
license = {file = "LICENSE"}

[project.urls]
"Homepage" = "https://github.com/atztogo/crymgen"

[tool.setuptools.dynamic]
version = { attr = "crymgen.version.__version__" }

[tool.ruff]
line-length = 88
select = [
    "F", # Flake8
    "B", # Black
    "I", # isort
    "E", # pycodestyle-errors
    "D", # pydocstyle
]
extend-ignore = [
    "D417",
    "D100",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
